; Default users of the UOS card. Change these passwords on a real terminal.
; Built into card/UOS/SYSUAF.DAT with:
;   python3 tools/mkuaf.py build tools/default_users.ini -o card/UOS/SYSUAF.DAT --seed uos-default-card

[ADMIN]
password = ADMIN-CHANGE-ME
privs = SYSTEM
home = ADMIN
flags = NOHACK

[OPER]
password = OPER-CHANGE-ME
privs = OPER
home = OPER
flags = NOHACK

[GUEST]
password = GUEST
home = GUEST
