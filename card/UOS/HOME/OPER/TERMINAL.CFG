; Menu of the OPER account. A user whose home holds TERMINAL.CFG gets
; this menu after the login in place of the shell. One entry of each type.
[terminal]
title = Operator console
header = HEADER.TXT

[entry 1]
label = Read the rounds checklist
type = text
target = ROUNDS.TXT

[entry 2]
label = Device controls
type = menu
target = CONTROL.CFG

[entry 3]
label = Show the system
type = command
target = SHOW SYSTEM

[entry 4]
label = Yard lights on or off
type = device
target = LIGHT1 TOGGLE

[entry 5]
label = Holotape library
type = holotape

[entry 6]
label = Log out
type = logout
