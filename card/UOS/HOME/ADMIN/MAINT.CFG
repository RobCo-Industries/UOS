[terminal]
title = Maintenance

[entry 1]
label = Read the maintenance notes
type = text
target = MAINT.TXT

[entry 2]
label = Toggle the yard lights
type = device
target = LIGHT1 TOGGLE
privs = 2

[entry 3]
label = Open the north door
type = device
target = DOOR1 OPEN
privs = 2

[entry 4]
label = Lock the vault door
type = device
target = VAULT LOCK
privs = 2

[entry 5]
label = Show the devices
type = command
target = SHOW DEVICES
