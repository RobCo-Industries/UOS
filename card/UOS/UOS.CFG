# UOS system settings. Every key is optional.

[system]
name = ROBCO TERMINAL
scheme = green

[login]
retries = 3
lockout_s = 30

[hack]
enabled = yes
user = GUEST
attempts = 4
difficulty = advanced
lockout_s = 60

[watchdog]
; The hardware watchdog resets the board when the loop stops.
; QEMU resets at once when it starts: keep it off there.
enabled = off
timeout_ms = 8000

[input]
; The six panel buttons on GPIO 5, 6, 17, 22, 26 and 27.
buttons = on

[audio]
; The sound path. Nothing is heard yet: on only opens it.
sound = off
; The fan loop. Read now, used by a later release.
fan = off
; 0 to 100.
volume = 80
