# UOS system settings. Every key is optional.

[system]
name = ROBCO TERMINAL
scheme = green

[login]
retries = 3
lockout_s = 30

[hack]
enabled = yes
user = GUEST
attempts = 4
difficulty = advanced
lockout_s = 60

[watchdog]
; The hardware watchdog resets the board when the loop stops.
; QEMU resets at once when it starts: keep it off there.
enabled = off
timeout_ms = 8000
