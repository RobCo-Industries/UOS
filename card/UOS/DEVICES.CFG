; UOS devices. One [device NAME] section per device, up to 16.
; Pins 4, 12, 13, 19, 20, 21 and 25 are free on every supported board.
; See docs/modules/dev.md for every key and limit.

; A door driven by a relay. OPEN and CLOSE need the OPER privilege.
[device DOOR1]
type = door
gpio = 4
active = high
initial = off
label = Workshop door

; A light on an active-low relay board. Anyone may switch it.
[device LIGHT1]
type = light
gpio = 25
active = low
initial = off
label = Hall lights
privs = 0

; A door strike. UNLOCK opens it for 2 seconds, then it locks again.
[device VAULT]
type = lock
gpio = 20
active = high
initial = off
pulse_ms = 2000
label = Vault door strike
privs = 2

; A motion sensor that pulls its line low when it trips.
[device MOTION1]
type = sensor
gpio = 21
active = low
label = Corridor motion
